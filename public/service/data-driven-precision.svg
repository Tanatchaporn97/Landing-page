<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f6fb"/>
      <stop offset="1" stop-color="#efedf9"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9b8ff"/>
      <stop offset="1" stop-color="#5f26e5"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a98cf5"/>
      <stop offset="1" stop-color="#6431d6"/>
    </linearGradient>
    <linearGradient id="dart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a98cf5"/>
      <stop offset="1" stop-color="#6431d6"/>
    </linearGradient>
    <radialGradient id="shadow3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5f26e5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5f26e5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)"/>
  <ellipse cx="220" cy="235" rx="100" ry="18" fill="url(#shadow3)"/>

  <!-- small bar chart on the left -->
  <g>
    <rect x="90" y="160" width="18" height="55" rx="4" fill="url(#bar)" opacity="0.85"/>
    <rect x="115" y="130" width="18" height="85" rx="4" fill="url(#bar)"/>
    <rect x="140" y="145" width="18" height="70" rx="4" fill="url(#bar)" opacity="0.7"/>
  </g>

  <!-- target / bullseye -->
  <circle cx="235" cy="150" r="70" fill="#ffffff"/>
  <circle cx="235" cy="150" r="70" fill="url(#ring1)" opacity="0.18"/>
  <circle cx="235" cy="150" r="70" fill="none" stroke="url(#ring1)" stroke-width="10"/>
  <circle cx="235" cy="150" r="46" fill="none" stroke="url(#ring2)" stroke-width="10"/>
  <circle cx="235" cy="150" r="22" fill="url(#ring1)"/>

  <!-- dart hitting center -->
  <g transform="translate(235,150) rotate(-40)">
    <polygon points="0,-14 6,10 0,4 -6,10" fill="url(#dart)"/>
    <line x1="0" y1="4" x2="0" y2="46" stroke="#7a4b1e" stroke-width="4" stroke-linecap="round"/>
    <polygon points="0,46 -9,58 0,52 9,58" fill="#e05252"/>
  </g>
</svg>
