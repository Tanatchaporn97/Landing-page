<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f6fb"/>
      <stop offset="1" stop-color="#efedf9"/>
    </linearGradient>
    <linearGradient id="person1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a98cf5"/>
      <stop offset="1" stop-color="#6431d6"/>
    </linearGradient>
    <linearGradient id="person2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b8ff"/>
      <stop offset="1" stop-color="#8b6cf0"/>
    </linearGradient>
    <linearGradient id="person3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b6cf0"/>
      <stop offset="1" stop-color="#5017b8"/>
    </linearGradient>
    <radialGradient id="shadow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5f26e5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5f26e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg2)"/>
  <ellipse cx="200" cy="235" rx="105" ry="18" fill="url(#shadow2)"/>

  <!-- three teammates, overlapping rounded silhouettes -->
  <g>
    <!-- left person -->
    <circle cx="140" cy="140" r="30" fill="url(#person2)"/>
    <path d="M90 220 q0 -55 50 -55 q50 0 50 55 z" fill="url(#person2)"/>

    <!-- right person -->
    <circle cx="260" cy="140" r="30" fill="url(#person3)"/>
    <path d="M210 220 q0 -55 50 -55 q50 0 50 55 z" fill="url(#person3)"/>

    <!-- center/front person -->
    <circle cx="200" cy="122" r="34" fill="url(#person1)"/>
    <path d="M145 215 q0 -62 55 -62 q55 0 55 62 z" fill="url(#person1)"/>
  </g>

  <!-- connecting network lines to an intelligence node -->
  <g stroke="#5f26e5" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
    <line x1="200" y1="88" x2="200" y2="60"/>
    <line x1="200" y1="88" x2="150" y2="70"/>
    <line x1="200" y1="88" x2="250" y2="70"/>
  </g>
  <circle cx="200" cy="50" r="4" fill="#5f26e5"/>
  <circle cx="150" cy="66" r="3.5" fill="#8b6cf0"/>
  <circle cx="250" cy="66" r="3.5" fill="#8b6cf0"/>

  <!-- intelligence spark / lightbulb above center -->
  <circle cx="200" cy="40" r="20" fill="url(#bulbGlow)"/>
  <path d="M200 26 a14 14 0 0 1 8 26 l-2 6 h-12 l-2 -6 a14 14 0 0 1 8 -26 z" fill="#ffd23f"/>
  <rect x="193" y="58" width="14" height="5" rx="2" fill="#b8860b"/>
</svg>
